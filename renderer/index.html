<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; media-src 'self' data: blob:;" />
<title>Aishe</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Inline icon sprite: no network, CSP-safe, themed via currentColor -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>

      <g id="i-chat"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></g>
      <g id="i-history"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></g>


      <g id="i-send"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></g>
      <g id="i-stop"><rect x="6" y="6" width="12" height="12" rx="2.5"/></g>
      <g id="i-mic"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></g>
      <g id="i-volume"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></g>
      <g id="i-volume-off"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></g>

      <g id="i-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></g>
      <g id="i-broom"><path d="M19.4 3.1 14 8.5"/><path d="m10.6 12 3.4-3.4"/><path d="M15.5 7 19 3.5a1.4 1.4 0 0 1 2 2L17.5 9"/><path d="m9.2 13.4 1.4 1.4"/><path d="M4 20l4.6-4.6c.8-.8.8-2 0-2.8a2 2 0 0 0-2.8 0L1.2 17"/><path d="m12.6 16.4 4.6 4.6"/><path d="M2 22l3.5-3.5"/></g>



      <g id="i-chevron"><path d="m6 9 6 6 6-6"/></g>
      <symbol id="i-key" viewBox="0 0 24 24"><path d="M14 7a4 4 0 1 0-3.5 3.97L4 17.5V20h3l1-1h2v-2h2l1.5-1.5A4 4 0 0 0 18 11a4 4 0 0 0-4-4zm1.5 4.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></symbol>
</defs>
  </svg>

  <div class="shell">
    <!-- ── left vertical rail ─────────────────────────────────── -->
    <nav class="rail" aria-label="Primary">
      <button class="rail-btn is-active" data-view="chat" data-tip="Chat" aria-label="Chat">
        <svg viewBox="0 0 24 24" class="ico"><use href="#i-chat"/></svg>
      </button>
      <button class="rail-btn" data-view="history" data-tip="History" aria-label="History">
        <svg viewBox="0 0 24 24" class="ico"><use href="#i-history"/></svg>
      </button>
      <span class="rail-grow"></span>
      <button class="rail-btn" data-view="keys" data-tip="API Keys" aria-label="API Keys">
        <svg viewBox="0 0 24 24" class="ico"><use href="#i-key"/></svg>
      </button>
    </nav>

    <div class="main-col">

      <main class="stage">
        <!-- ── CHAT ─────────────────────────────────────────────── -->
        <section class="view is-active" id="view-chat">
          <input type="hidden" id="chat-thread" value="main" />
          <input type="checkbox" id="chat-speak" hidden />

          <div class="messages" id="messages">
            <div class="empty" id="chat-empty">
              <div class="empty-icon"><svg viewBox="0 0 24 24" class="ico lg"><use href="#i-chat"/></svg></div>
              <p class="empty-title">Ask Aishe anything</p>
              <p class="empty-sub">Streaming answers with tools, memory and optional voice.</p>
            </div>
          </div>

          <div class="composer-wrap">
            <div class="composer">
              <textarea id="chat-input" rows="1" placeholder="Message Aishe…"></textarea>
              <button class="send" id="btn-chat-send" title="Send" aria-label="Send">
                <svg viewBox="0 0 24 24" class="ico" id="send-icon"><use href="#i-send"/></svg>
              </button>
            </div>

            <!-- secondary controls live BELOW the input, out of the way -->
            <div class="composer-meta">
              <label class="model-pick" title="Active model — changing this restarts the agent">
                <select id="model-select" aria-label="Model"></select>
                <svg viewBox="0 0 24 24" class="ico xs"><use href="#i-chevron"/></svg>
              </label>
              <span class="model-state" id="model-state"></span>
              <span class="grow"></span>
              <button class="mini-btn danger" id="btn-clear-chat" title="Clear transcript" aria-label="Clear transcript">
                <svg viewBox="0 0 24 24" class="ico sm"><use href="#i-broom"/></svg>
              </button>
              <button class="mini-btn" id="btn-mic" title="Dictate" aria-label="Dictate">
                <svg viewBox="0 0 24 24" class="ico sm"><use href="#i-mic"/></svg>
              </button>
              <button class="mini-btn" id="btn-speak" title="Speak replies" aria-label="Speak replies">
                <svg viewBox="0 0 24 24" class="ico sm" id="speak-icon"><use href="#i-volume-off"/></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- ── HISTORY ──────────────────────────────────────────── -->
        <section class="view" id="view-history">
          <div class="pane is-active" id="pane-sessions">
            <div class="bar">
              <div class="search">
                <svg viewBox="0 0 24 24" class="ico sm"><use href="#i-search"/></svg>
                <input type="text" id="ses-query" placeholder="Search this conversation…" />
              </div>
              <button class="btn primary sm" id="btn-ses-search">Search</button>
              <span class="grow"></span>
              <span class="muted" id="ses-stats"></span>
              <button class="btn ghost sm" id="btn-ses-reload">Reload</button>
            </div>
            <div class="list" id="ses-detail"><p class="muted pad">Loading…</p></div>
          </div>
        </section>

        <!-- ── SETTINGS ─────────────────────────────────────────── -->
        <section class="view" id="view-keys">
          <div class="pane is-active" id="pane-keys">

            <h2 class="sec-head">Keys</h2>
            <div class="card" id="keys-form">
              <div class="list" id="key-rows"></div>
              <div class="actions">
                <button class="btn primary" id="btn-keys-save">Save keys</button>
                <button class="btn ghost" id="btn-keys-reload">Reload</button>
                <span class="muted" id="keys-result"></span>
              </div>
            </div>

            <h2 class="sec-head">Memory</h2>
            <div class="card">
              <div class="list" id="mem-rows">
                <p class="muted pad">Probing memory…</p>
              </div>
              <div class="actions">
                <button class="btn ghost sm" id="btn-mem-recheck">Re-check</button>
              </div>
            </div>

            <h2 class="sec-head">Voice</h2>
            <div class="card">
              <div class="list" id="voice-rows">
                <p class="muted pad">Loading voice settings…</p>
              </div>
              <div class="actions">
                <button class="btn ghost sm" id="btn-voice-reload">Reload</button>
                <span class="muted" id="voice-result"></span>
              </div>
            </div>
          </div>
        </section>

        </main>
            </div>
          </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
